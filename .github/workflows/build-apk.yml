name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Permisos de gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar el APK con la fecha y el numero de compilacion
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            mv "$f" "BuquesSantander-v1.1-build${{ github.run_number }}-$(date +%Y%m%d-%H%M).apk"
          done
          ls -l

      - name: Subir el APK
        uses: actions/upload-artifact@v5
        with:
          name: BuquesSantander-apk-build${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
